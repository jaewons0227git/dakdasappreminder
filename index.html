<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Login</title>
    <style>
        /* 기본 리셋 및 폰트 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, "Noto Sans KR", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* html, body 높이 설정 */
        html {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
        }

        body {
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden; /* 스크롤 방지 */
            
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1; /* 1:1 비율 유지 */
            margin: 0 auto;
            border: none;
            border-radius: 0;
            box-shadow: none;
            position: relative;
        }

        /* 화면 컨테이너 (입력, 확인, 성공 화면 공통) */
        .screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #success-screen {
            display: none;
            justify-content: center;
            padding-bottom: 20px;
        }

        /* 상단 컨텐츠 영역 */
        .content-area {
            padding: 40px 24px 0 24px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        /* 안내 문구 */
        .title {
            font-size: 26px;
            font-weight: 700;
            color: #191f28;
            margin-bottom: 40px;
            line-height: 1.4;
            animation: fadeIn 0.5s ease-out;
        }

        /* 입력 폼 스타일 (수정됨) */
        .form-group {
            margin-bottom: 24px;
        }

        .toss-input {
            width: 100%;
            padding: 10px 0;
            font-size: 20px;
            color: #333d4b;
            border: none;
            border-bottom: 2px solid #e5e8eb;
            outline: none;
            transition: border-color 0.3s;
            background: transparent;
        }

        .toss-input:focus {
            border-bottom: 2px solid #0064FF;
        }

        .toss-input::placeholder {
            color: #b0b8c1;
            font-size: 20px;
        }

        /* 하단 영역 (버튼) */
        .bottom-area {
            width: 100%;
            padding-bottom: 20px;
            background-color: #ffffff;
            padding-left: 24px;
            padding-right: 24px;
        }

        /* 버튼 래퍼 */
        .next-btn-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        /* 파란색 확인 버튼 */
        .next-btn {
            width: 100%;
            padding: 18px 0;
            background-color: #0064FF;
            color: white;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .next-btn:active {
            background-color: #0050cc;
        }
        
        /* 회원가입 버튼 (작은 둥근 사각형) */
        .signup-btn {
            padding: 10px 20px;
            background-color: #f2f4f6;
            color: #4e5968;
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .signup-btn:active {
            background-color: #e5e8eb;
        }

        /* 성공 화면 스타일 */
        .confirm-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        .confirm-title {
            font-size: 26px;
            font-weight: 700;
            color: #191f28;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        /* 성공 아이콘 애니메이션 */
        .check-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
        }

        /* 자체 모달 (토스트/알림) 스타일 */
        #custom-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background-color: rgba(51, 61, 75, 0.95);
            color: white;
            padding: 16px 24px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 1000;
            width: 80%;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        #custom-modal.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* 애니메이션 정의 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="input-screen" class="screen">
        <div class="content-area">
            <div class="title">안녕하세요<br>로그인해주세요</div>
            
            <div class="form-group">
                <input type="text" id="login-id" class="toss-input" placeholder="아이디 또는 이메일" autocomplete="off">
            </div>
            <div class="form-group">
                <input type="password" id="login-pw" class="toss-input" placeholder="비밀번호" autocomplete="off">
            </div>
        </div>

        <div class="bottom-area">
            <div class="next-btn-wrapper">
                <button class="next-btn" onclick="attemptLogin()">로그인</button>
                <button class="signup-btn" onclick="location.href='newaccount.html'">또는 회원가입</button>
            </div>
        </div>
    </div>

    <div id="success-screen" class="screen">
        <div class="confirm-content">
            <img src="icon/check.webp" class="check-icon" alt="성공">
            <div class="confirm-title">
                로그인되었습니다
            </div>
        </div>
    </div>

    <div id="custom-modal">메시지 내용</div>

    <script>
        // 모달 표시 함수
        function showModal(message) {
            const modal = document.getElementById('custom-modal');
            modal.innerText = message;
            modal.classList.add('show');
            
            setTimeout(() => {
                modal.classList.remove('show');
            }, 2000);
        }

        // 로그인 요청 함수
        function attemptLogin() {
            const loginId = document.getElementById('login-id').value;
            const password = document.getElementById('login-pw').value;

            if (!loginId || !password) {
                showModal("아이디와 비밀번호를 입력해주세요.");
                return;
            }

            fetch('https://jaewondev.pythonanywhere.com/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ 
                    login_id: loginId,
                    password: password
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // 로그인 성공 처리
                    localStorage.setItem('loginUser', data.name);
                    
                    document.getElementById('input-screen').style.display = 'none';
                    document.getElementById('success-screen').style.display = 'flex';

                    setTimeout(function() {
                        window.location.href = 'app.html';
                    }, 1000);
                } else {
                    // 로그인 실패 (모달 표시)
                    showModal(data.message);
                }
            })
            .catch((error) => {
                console.error('Error:', error);
                showModal("서버와 통신할 수 없습니다.");
            });
        }
    </script>
</body>
</html>
