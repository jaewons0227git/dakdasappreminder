<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Login</title>
    <style>
        /* 기본 리셋 및 폰트 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, "Noto Sans KR", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* html, body 높이 설정 */
        html {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
        }

        body {
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden; /* 스크롤 방지 */
            
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1; /* 1:1 비율 유지 */
            margin: 0 auto;
            border: none;
            border-radius: 0;
            box-shadow: none;
            position: relative;
        }

        /* 화면 컨테이너 */
        .screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #input-screen {
            display: none; /* 로딩 확인 후 표시 */
        }

        #success-screen {
            display: none;
            justify-content: center;
            padding-bottom: 20px;
        }

        /* 상단 컨텐츠 영역 */
        .content-area {
            padding: 40px 24px 0 24px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        /* 안내 문구 */
        .title {
            font-size: 26px;
            font-weight: 700;
            color: #191f28;
            margin-bottom: 40px;
            line-height: 1.4;
            animation: fadeIn 0.5s ease-out;
        }

        /* 입력 폼 스타일 */
        .form-group {
            margin-bottom: 24px;
        }

        .toss-input {
            width: 100%;
            padding: 10px 0;
            font-size: 20px;
            color: #333d4b;
            border: none;
            border-bottom: 2px solid #e5e8eb;
            outline: none;
            transition: border-color 0.3s;
            background: transparent;
        }

        .toss-input:focus {
            border-bottom: 2px solid #0064FF;
        }

        .toss-input::placeholder {
            color: #b0b8c1;
            font-size: 20px;
        }

        /* --- [수정됨] 자동 로그인 체크박스 스타일 --- */
        .checkbox-container {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            cursor: pointer;
            user-select: none;
            width: fit-content; /* 클릭 영역 최적화 */
        }

        /* 실제 체크박스는 숨김 */
        .checkbox-container input[type="checkbox"] {
            display: none;
        }

        /* 커스텀 체크박스 네모 */
        .custom-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid #d1d6db;
            border-radius: 6px;
            margin-right: 10px;
            position: relative;
            transition: all 0.2s ease;
            background-color: white;
            flex-shrink: 0; /* 크기 줄어듦 방지 */
        }

        /* 체크되었을 때 스타일 */
        .checkbox-container input:checked + .custom-checkbox {
            background-color: #0064FF;
            border-color: #0064FF;
        }

        /* [중요 수정] 체크 표시 가운데 정렬 (수학적 중앙 + 시각적 보정) */
        .custom-checkbox::after {
            content: '';
            position: absolute;
            left: 50%;   /* 박스의 가로 50% 지점 */
            top: 50%;    /* 박스의 세로 50% 지점 */
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            /* translate(-50%, -60%): 정중앙(-50%, -50%)보다 위로(-60%) 살짝 올려야 
               체크 모양(ㄴ)의 시각적 무게중심이 맞음 
            */
            transform: translate(-50%, -60%) rotate(45deg);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .checkbox-container input:checked + .custom-checkbox::after {
            opacity: 1;
        }

        .checkbox-label {
            font-size: 16px;
            color: #4e5968;
        }

        /* 하단 영역 (버튼) */
        .bottom-area {
            width: 100%;
            padding-bottom: 20px;
            background-color: #ffffff;
            padding-left: 24px;
            padding-right: 24px;
        }

        .next-btn-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .next-btn {
            width: 100%;
            padding: 18px 0;
            background-color: #0064FF;
            color: white;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .next-btn:active {
            background-color: #0050cc;
        }
        
        .signup-btn {
            padding: 10px 20px;
            background-color: #f2f4f6;
            color: #4e5968;
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .signup-btn:active {
            background-color: #e5e8eb;
        }

        /* 성공 화면 스타일 */
        .confirm-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        .confirm-title {
            font-size: 26px;
            font-weight: 700;
            color: #191f28;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .check-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
        }

        /* 구글 스타일 로딩 스피너 오버레이 */
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* SVG 스피너 스타일 */
        .spinner-svg {
            width: 50px;
            height: 50px;
            animation: rotate 2s linear infinite;
        }

        .spinner-circle {
            stroke: #0064FF;
            stroke-width: 4;
            stroke-dasharray: 1, 200;
            stroke-dashoffset: 0;
            stroke-linecap: round; /* 둥근 끝부분 */
            fill: none;
            animation: dash 1.5s ease-in-out infinite;
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        @keyframes dash {
            0% { stroke-dasharray: 1, 200; stroke-dashoffset: 0; }
            50% { stroke-dasharray: 89, 200; stroke-dashoffset: -35px; }
            100% { stroke-dasharray: 89, 200; stroke-dashoffset: -124px; }
        }

        /* 자체 모달 스타일 */
        #custom-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background-color: rgba(51, 61, 75, 0.95);
            color: white;
            padding: 16px 24px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 3000;
            width: 80%;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        #custom-modal.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <svg class="spinner-svg" viewBox="25 25 50 50">
            <circle class="spinner-circle" cx="50" cy="50" r="20"></circle>
        </svg>
    </div>

    <div id="input-screen" class="screen">
        <div class="content-area">
            <div class="title">안녕하세요<br>로그인해주세요</div>
            
            <div class="form-group">
                <input type="text" id="login-id" class="toss-input" placeholder="아이디 또는 이메일" autocomplete="off">
            </div>
            <div class="form-group">
                <input type="password" id="login-pw" class="toss-input" placeholder="비밀번호" autocomplete="off">
            </div>

            <label class="checkbox-container">
                <input type="checkbox" id="auto-login-check">
                <span class="custom-checkbox"></span>
                <span class="checkbox-label">자동 로그인</span>
            </label>
        </div>

        <div class="bottom-area">
            <div class="next-btn-wrapper">
                <button class="next-btn" onclick="attemptLogin()">로그인</button>
                <button class="signup-btn" onclick="location.href='newaccount.html'">또는 회원가입</button>
            </div>
        </div>
    </div>

    <div id="success-screen" class="screen">
        <div class="confirm-content">
            <img src="icon/check.webp" class="check-icon" alt="성공">
            <div class="confirm-title">
                로그인되었습니다
            </div>
        </div>
    </div>

    <div id="custom-modal">메시지 내용</div>

    <script>
        // 페이지 로드 시 자동 로그인 확인
        window.addEventListener('DOMContentLoaded', () => {
            const loadingOverlay = document.getElementById('loading-overlay');
            const inputScreen = document.getElementById('input-screen');

            const localUser = localStorage.getItem('loginUser');
            const sessionUser = sessionStorage.getItem('loginUser');

            if (localUser || sessionUser) {
                // 로그인 정보 존재 시 0.8초 후 이동 (스피너 보여줌)
                setTimeout(() => {
                    window.location.href = 'app.html';
                }, 800);
            } else {
                // 정보 없으면 0.5초 후 로그인 화면 표시
                setTimeout(() => {
                    loadingOverlay.style.display = 'none';
                    inputScreen.style.display = 'flex';
                }, 500);
            }
        });

        function showModal(message) {
            const modal = document.getElementById('custom-modal');
            modal.innerText = message;
            modal.classList.add('show');
            setTimeout(() => { modal.classList.remove('show'); }, 2000);
        }

        function attemptLogin() {
            const loginId = document.getElementById('login-id').value;
            const password = document.getElementById('login-pw').value;
            const isAutoLogin = document.getElementById('auto-login-check').checked;

            if (!loginId || !password) {
                showModal("아이디와 비밀번호를 입력해주세요.");
                return;
            }

            fetch('https://jaewondev.pythonanywhere.com/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    login_id: loginId,
                    password: password
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    if (isAutoLogin) {
                        localStorage.setItem('loginUser', data.name);
                        sessionStorage.removeItem('loginUser');
                    } else {
                        sessionStorage.setItem('loginUser', data.name);
                        localStorage.removeItem('loginUser');
                    }
                    
                    document.getElementById('input-screen').style.display = 'none';
                    document.getElementById('success-screen').style.display = 'flex';

                    setTimeout(function() {
                        window.location.href = 'app.html';
                    }, 1000);
                } else {
                    showModal(data.message);
                }
            })
            .catch((error) => {
                console.error('Error:', error);
                showModal("서버와 통신할 수 없습니다.");
            });
        }
    </script>
</body>
</html>
