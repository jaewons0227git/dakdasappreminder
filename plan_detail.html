<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Plan</title>
    <style>
        /* --- 1. 기본 설정 및 Toss 느낌의 폰트/컬러 --- */
        :root {
            --primary-color: #3182f6; /* 토스 블루 */
            --bg-color: #f2f4f6;
            --text-main: #191f28;
            --text-sub: #8b95a1;
            --line-color: #e5e8eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: #ffffff; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            color: var(--text-main);
        }

        /* --- 2. 상단 헤더 --- */
        .top-bar {
            padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--line-color);
            flex-shrink: 0;
            background: white; z-index: 10;
        }
        .date-display { font-size: 17px; font-weight: 700; color: var(--text-main); border: none; outline: none; background: transparent; }
        
        .save-btn { 
            background: var(--primary-color); color: white; border: none; padding: 8px 14px; 
            border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; 
            transition: transform 0.1s;
        }
        .save-btn:active { transform: scale(0.95); }
        .back-btn { background: none; border: none; font-size: 22px; margin-right: 10px; cursor: pointer; color: #333; }

        /* --- 3. 메인 컨텐츠 (좌우 분할) --- */
        .main-container {
            flex-grow: 1; display: flex; height: 100%; overflow: hidden;
        }

        /* [좌측] 타임테이블 */
        .left-panel {
            width: 140px; border-right: 1px solid var(--line-color);
            display: flex; flex-direction: column; overflow-y: auto; background: #fdfdfd;
        }
        .section-title {
            padding: 12px; text-align: center; font-size: 12px; font-weight: 600; color: var(--text-sub); border-bottom: 1px solid var(--line-color);
        }

        /* 격자 영역 */
        .timetable-grid { padding: 10px 0; display: flex; flex-direction: column; align-items: center; }
        
        .grid-row { display: flex; align-items: center; height: 26px; width: 100%; padding-left: 5px; }
        
        /* [수정됨] 시간 라벨 정렬 버그 해결 */
        .time-label {
            width: 35px; /* 고정 너비 */
            font-size: 12px; color: var(--text-sub); 
            display: flex; justify-content: center; align-items: center; /* 중앙 정렬 */
            margin-right: 8px; font-variant-numeric: tabular-nums; /* 숫자 폭 통일 */
        }
        
        .cell-container { display: flex; }
        .cell {
            width: 15px; height: 15px; /* 정사각형 */
            border: 1px solid #d1d6db; margin-right: 2px; border-radius: 3px; cursor: pointer;
            transition: background-color 0.1s, transform 0.1s;
        }
        .cell.filled { background-color: var(--primary-color); border-color: var(--primary-color); }
        /* 마지막 선택 지점 표시 (UX) */
        .cell.range-start { border-color: #ff4d4d; border-width: 2px; }

        /* 하단 버튼 및 통계 */
        .left-footer { padding: 15px; border-top: 1px solid var(--line-color); background: #f9fafb; }
        .reset-btn {
            width: 100%; padding: 8px; margin-bottom: 15px;
            background: white; border: 1px solid #d1d6db; border-radius: 8px;
            color: var(--text-sub); font-size: 12px; font-weight: 600; cursor: pointer;
            transition: all 0.2s;
        }
        .reset-btn:active { transform: scale(0.95); background: #f2f4f6; }

        .stat-item { margin-bottom: 6px; display: flex; justify-content: space-between; font-size: 12px; color: var(--text-sub); }
        .stat-val { font-weight: 700; color: var(--text-main); font-size: 14px; }


        /* [우측] 리스트 */
        .right-panel { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; background: white; }
        
        .plan-table { width: 100%; border-collapse: collapse; }
        .plan-table th {
            background: #f9fafb; color: var(--text-sub); font-size: 12px; font-weight: 600;
            padding: 10px 4px; border-bottom: 1px solid var(--line-color); text-align: center; white-space: nowrap;
        }
        .plan-table td { border-bottom: 1px solid #f2f4f6; padding: 8px 4px; vertical-align: middle; }
        
        input.clean-input {
            width: 100%; border: none; outline: none; font-size: 14px; color: var(--text-main);
            background: transparent; text-align: center; padding: 4px; border-radius: 6px;
        }
        input.clean-input:focus { background: #e8f3ff; }
        input.clean-input.text-left { text-align: left; padding-left: 8px; }

        /* --- 4. 애니메이션 체크박스 (SVG) --- */
        .check-wrapper { 
            display: flex; justify-content: center; align-items: center; 
            width: 24px; height: 24px; margin: 0 auto; cursor: pointer;
        }
        
        /* 숨겨진 체크박스 */
        .hidden-checkbox { display: none; }
        
        /* 커스텀 테두리 */
        .custom-box {
            width: 20px; height: 20px; border: 2px solid #d1d6db; border-radius: 6px;
            position: relative; transition: all 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .hidden-checkbox:checked + .custom-box {
            background-color: var(--primary-color); border-color: var(--primary-color);
        }

        /* 체크 아이콘 (SVG 애니메이션) */
        .check-svg { width: 14px; height: 14px; fill: none; stroke: white; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset 0.3s ease; }
        .hidden-checkbox:checked + .custom-box .check-svg { stroke-dashoffset: 0; }

        /* --- 5. 모달 (Toss Style) --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); align-items: center; justify-content: center; z-index: 100;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal-overlay.hide { opacity: 0; }

        .modal-box {
            background: white; padding: 30px; border-radius: 24px; text-align: center; width: 280px;
            transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .modal-overlay.show .modal-box { transform: scale(1); }
        
        .modal-icon { width: 50px; height: 50px; margin-bottom: 15px; display: inline-block; }
        .modal-msg { font-size: 17px; font-weight: 700; color: #191f28; margin-bottom: 24px; line-height: 1.4; }
        .modal-btn {
            background: var(--primary-color); color: white; width: 100%; padding: 14px;
            border: none; border-radius: 16px; font-size: 16px; font-weight: 600; cursor: pointer;
            transition: background-color 0.2s;
        }
        .modal-btn:active { background-color: #0050cc; }
        
        /* 체크 아이콘 애니메이션용 (CSS Drawing) */
        .circle-check {
            width: 50px; height: 50px; border-radius: 50%; background: var(--primary-color);
            position: relative; display: flex; align-items: center; justify-content: center;
            animation: popIcon 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .circle-check::after {
            content: ''; width: 14px; height: 24px; border: solid white; border-width: 0 4px 4px 0;
            transform: rotate(45deg); margin-top: -4px;
        }

        @keyframes popIcon { from { transform: scale(0); } to { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="top-bar">
        <div style="display:flex; align-items:center;">
            <button class="back-btn" onclick="location.href='today.html'">←</button>
            <input type="date" id="datePicker" class="date-display">
        </div>
        <button class="save-btn" onclick="saveData()">저장</button>
    </div>

    <div class="main-container">
        <div class="left-panel">
            <div class="section-title">TIME TABLE</div>
            <div class="timetable-grid" id="timeGrid">
                </div>
            
            <div class="left-footer">
                <button class="reset-btn" onclick="clearAllGrid()">전체 비우기</button>
                <div class="stat-item">
                    <span>가용 시간</span>
                    <span class="stat-val" id="availTime">18h 00m</span>
                </div>
                <div class="stat-item">
                    <span>총 공부</span>
                    <span class="stat-val" id="totalTime" style="color:var(--primary-color)">00h 00m</span>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <table class="plan-table">
                <colgroup>
                    <col width="10%"> <col width="20%"> <col width="35%"> <col width="10%"> <col width="12.5%"> <col width="12.5%">
                </colgroup>
                <thead>
                    <tr><th>순위</th><th>과목</th><th>할일</th><th>✔</th><th>예상</th><th>소요</th></tr>
                </thead>
            </table>
            
            <div style="overflow-y: auto; flex-grow: 1;">
                <table class="plan-table">
                    <colgroup>
                        <col width="10%"> <col width="20%"> <col width="35%"> <col width="10%"> <col width="12.5%"> <col width="12.5%">
                    </colgroup>
                    <tbody id="taskListBody">
                        </tbody>
                </table>
                <div style="padding:15px; text-align:center;">
                    <button onclick="addRow()" style="background:#f9fafb; border:1px dashed #d1d6db; padding:10px 24px; border-radius:20px; color:#8b95a1; font-size:13px; cursor:pointer;">+ 항목 추가</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <div style="display:flex; justify-content:center; margin-bottom:20px;">
                <div class="circle-check"></div>
            </div>
            <div class="modal-msg" id="modalMsg">완료했습니다!</div>
            <button class="modal-btn" onclick="closeModal()">확인</button>
        </div>
    </div>

    <script>
        // PythonAnywhere 주소로 변경
        const API_URL = 'https://jaewondev.pythonanywhere.com';
        const userName = localStorage.getItem('loginUser') || "GUEST";
        const urlParams = new URLSearchParams(window.location.search);
        let currentDate = urlParams.get('date') || new Date().toISOString().split('T')[0];

        // 6시 ~ 24시 (0시) -> 총 18시간
        const START_HOUR = 6;
        const END_HOUR = 24; 
        const TOTAL_HOURS = END_HOUR - START_HOUR;
        const TOTAL_CELLS = TOTAL_HOURS * 6; // 10분 단위

        let planData = {
            date: currentDate,
            grid: Array(TOTAL_CELLS).fill(0),
            tasks: []
        };
        
        // 스마트 채우기를 위한 변수
        let lastClickedIndex = null;

        window.onload = function() {
            document.getElementById('datePicker').value = currentDate;
            if(urlParams.get('new') === 'true') {
                for(let i=0; i<5; i++) addRowData();
                renderAll();
            } else {
                fetchData();
            }
        };

        function fetchData() {
            fetch(`${API_URL}/get-plan-detail`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: userName, date: currentDate })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    planData = data.plan;
                    // 그리드 크기가 다를 경우(이전 버전 데이터) 초기화 방지 로직 필요하나 여기선 덮어씀
                    if(planData.grid.length !== TOTAL_CELLS) {
                        // 크기 안맞으면 새 규격으로 초기화 (데이터 손실 주의)
                        planData.grid = Array(TOTAL_CELLS).fill(0); 
                    }
                } else {
                    for(let i=0; i<5; i++) addRowData();
                }
                renderAll();
            })
            .catch(err => {
                alert("서버 연결 실패. 파이썬애니웨어 서버가 켜져있는지 확인하세요.");
            });
        }

        // --- 렌더링 ---
        function renderAll() {
            renderGrid();
            renderTasks();
            calcStats();
        }

        function renderGrid() {
            const gridEl = document.getElementById('timeGrid');
            gridEl.innerHTML = "";
            
            for(let h=0; h < TOTAL_HOURS; h++) {
                const hourLabel = START_HOUR + h;
                
                const row = document.createElement('div');
                row.className = 'grid-row';
                
                // 시간 라벨 (Flexbox로 중앙 정렬되어 더 이상 밀리지 않음)
                row.innerHTML = `<div class="time-label">${hourLabel}</div>`;
                
                const cellContainer = document.createElement('div');
                cellContainer.className = 'cell-container';
                
                for(let m=0; m<6; m++) {
                    const idx = h*6 + m;
                    const cell = document.createElement('div');
                    // 클래스 적용
                    let classes = `cell ${planData.grid[idx] ? 'filled' : ''}`;
                    if(lastClickedIndex === idx) classes += ' range-start';
                    
                    cell.className = classes;
                    cell.onclick = () => handleCellClick(idx);
                    cellContainer.appendChild(cell);
                }
                row.appendChild(cellContainer);
                gridEl.appendChild(row);
            }
        }

        // --- 핵심 기능: 스마트 채우기 (Range Fill) ---
        function handleCellClick(idx) {
            // 1. 범위 채우기 로직 (이전에 클릭한 인덱스가 있고, 다른 칸을 클릭했을 때)
            if (lastClickedIndex !== null && lastClickedIndex !== idx) {
                const start = Math.min(lastClickedIndex, idx);
                const end = Math.max(lastClickedIndex, idx);
                
                // 범위 내를 모두 1(채움)로 변경. 만약 이미 다 차있으면 비울 수도 있지만, 보통 채우기를 원함.
                for(let i=start; i<=end; i++) {
                    planData.grid[i] = 1; 
                }
                
                // 범위 지정 후 초기화
                lastClickedIndex = null;
            } else {
                // 2. 일반 토글 (클릭한 칸 반전) 및 시작점 설정
                planData.grid[idx] = planData.grid[idx] ? 0 : 1;
                
                // 같은 칸을 두 번 누르면 범위 지정 취소
                if(lastClickedIndex === idx) {
                    lastClickedIndex = null;
                } else {
                    // 채워진 칸을 누를 때만 범위 시작점으로 잡음 (비워진 칸을 누르면 그냥 토글만)
                    if(planData.grid[idx] === 1) {
                        lastClickedIndex = idx;
                    } else {
                        lastClickedIndex = null;
                    }
                }
            }
            
            renderGrid();
            calcStats();
        }

        function clearAllGrid() {
            if(confirm("시간표를 모두 지우시겠습니까?")) {
                planData.grid = Array(TOTAL_CELLS).fill(0);
                lastClickedIndex = null;
                renderAll();
            }
        }

        function renderTasks() {
            const tbody = document.getElementById('taskListBody');
            tbody.innerHTML = "";
            
            planData.tasks.forEach((task, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input class="clean-input" value="${task.rank}" onchange="updateTask(${idx}, 'rank', this.value)"></td>
                    <td><input class="clean-input" value="${task.subject}" placeholder="과목" onchange="updateTask(${idx}, 'subject', this.value)"></td>
                    <td><input class="clean-input text-left" value="${task.content}" placeholder="할 일 입력" onchange="updateTask(${idx}, 'content', this.value)"></td>
                    <td>
                        <label class="check-wrapper">
                            <input type="checkbox" class="hidden-checkbox" ${task.done ? 'checked' : ''} onchange="toggleCheck(${idx})">
                            <div class="custom-box">
                                <svg class="check-svg" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            </div>
                        </label>
                    </td>
                    <td><input type="number" class="clean-input" value="${task.est}" placeholder="-" onchange="updateTask(${idx}, 'est', this.value)"></td>
                    <td><input type="number" class="clean-input" value="${task.act}" placeholder="-" onchange="updateTask(${idx}, 'act', this.value); calcStats();"></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function toggleCheck(idx) {
            planData.tasks[idx].done = !planData.tasks[idx].done;
            // 리렌더링하지 않고 체크박스 상태만 유지해도 되지만, 데이터 동기화를 위해
            // 애니메이션은 CSS가 처리하므로 데이터만 바꿈
            if(planData.tasks[idx].done) {
                showModal(`"${planData.tasks[idx].content || '할 일'}"<br>완료했습니다!`);
            }
        }

        function updateTask(idx, key, val) {
            planData.tasks[idx][key] = val;
        }

        function addRowData() {
            planData.tasks.push({ rank: planData.tasks.length+1, subject: '', content: '', done: false, est: '', act: '' });
        }
        function addRow() { addRowData(); renderTasks(); }

        function calcStats() {
            // 18시간 기준
            const filled = planData.grid.filter(v => v===1).length;
            const totalMin = TOTAL_HOURS * 60; 
            const remain = totalMin - (filled * 10);
            
            document.getElementById('availTime').innerText = minToTime(remain);

            let actSum = 0;
            planData.tasks.forEach(t => { if(t.act) actSum += parseInt(t.act); });
            document.getElementById('totalTime').innerText = minToTime(actSum);
        }

        function minToTime(m) {
            if(m < 0) m = 0;
            const hour = Math.floor(m / 60);
            const min = m % 60;
            return `${hour}h ${min}m`;
        }

        // --- 저장 및 모달 ---
        function saveData() {
            planData.date = document.getElementById('datePicker').value;
            fetch(`${API_URL}/save-plan`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: userName, plan: planData })
            })
            .then(res => res.json())
            .then(data => {
                showModal("계획표가 저장되었습니다.");
            });
        }

        const modalEl = document.getElementById('modal');
        function showModal(msg) {
            document.getElementById('modalMsg').innerHTML = msg;
            modalEl.classList.remove('hide');
            modalEl.classList.add('show');
        }

        function closeModal() {
            // 닫힘 애니메이션
            modalEl.classList.remove('show');
            modalEl.classList.add('hide');
            // 애니메이션 끝난 후 display:none 처리는 CSS transitionend 이벤트나 setTimeout으로
            setTimeout(() => {
                if(modalEl.classList.contains('hide')) {
                    modalEl.classList.remove('show', 'hide'); // 클래스 초기화
                }
            }, 300);
        }
    </script>
</body>
</html>
