<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>회원가입</title>
    <style>
        /* 기본 스타일은 index.html과 동일하게 유지 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, "Noto Sans KR", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
        }

        body {
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            border: none;
            border-radius: 0;
            box-shadow: none;
            position: relative;
        }

        .screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            display: none; /* 기본적으로 숨김, JS로 제어 */
        }
        
        #step1-screen { display: flex; } /* 첫 화면만 보임 */

        .content-area {
            padding: 40px 24px 0 24px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .title {
            font-size: 26px;
            font-weight: 700;
            color: #191f28;
            margin-bottom: 30px;
            line-height: 1.4;
            animation: fadeIn 0.5s ease-out;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        
        .input-label {
            font-size: 13px;
            color: #8b95a1;
            margin-bottom: 8px;
            display: block;
        }

        .toss-input {
            width: 100%;
            padding: 10px 0;
            font-size: 20px;
            color: #333d4b;
            border: none;
            border-bottom: 2px solid #e5e8eb;
            outline: none;
            transition: border-color 0.3s;
            background: transparent;
        }

        .toss-input:focus {
            border-bottom: 2px solid #0064FF;
        }
        
        .toss-input.success {
            border-bottom: 2px solid #2ecc71 !important; /* 초록색 */
        }
        
        .toss-input.error {
            border-bottom: 2px solid #ff3b30 !important;
        }

        .bottom-area {
            width: 100%;
            padding-bottom: 20px;
            background-color: #ffffff;
            padding-left: 24px;
            padding-right: 24px;
        }

        .next-btn {
            width: 100%;
            padding: 18px 0;
            background-color: #0064FF;
            color: white;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .next-btn:active {
            background-color: #0050cc;
        }
        
        .next-btn:disabled {
            background-color: #b0b8c1;
            cursor: not-allowed;
        }

        /* 이메일 인증 레이아웃 */
        .email-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        
        .send-code-btn {
            padding: 10px 14px;
            background-color: #f2f4f6;
            color: #4e5968;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            height: 45px;
            margin-bottom: 2px;
        }
        
        .send-code-btn:active {
            background-color: #e5e8eb;
        }

        /* 모달 스타일 */
        #custom-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background-color: rgba(51, 61, 75, 0.95);
            color: white;
            padding: 16px 24px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 1000;
            width: 80%;
            text-align: center;
        }

        #custom-modal.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="step1-screen" class="screen">
        <div class="content-area">
            <div class="title">반가워요!<br>이름을 알려주세요</div>
            <div class="form-group">
                <input type="text" id="reg-name" class="toss-input" placeholder="이름 입력" autocomplete="off">
            </div>
        </div>
        <div class="bottom-area">
            <button class="next-btn" onclick="goStep2()">다음</button>
        </div>
    </div>

    <div id="step2-screen" class="screen">
        <div class="content-area">
            <div class="title">사용할 아이디와<br>비밀번호를 입력해주세요</div>
            <div class="form-group">
                <span class="input-label">아이디</span>
                <input type="text" id="reg-id" class="toss-input" placeholder="영문, 숫자 포함" autocomplete="off">
            </div>
            <div class="form-group">
                <span class="input-label">비밀번호</span>
                <input type="password" id="reg-pw" class="toss-input" placeholder="비밀번호" autocomplete="off">
            </div>
            <div class="form-group">
                <span class="input-label">비밀번호 확인</span>
                <input type="password" id="reg-pw-check" class="toss-input" placeholder="비밀번호 재입력" autocomplete="off">
            </div>
        </div>
        <div class="bottom-area">
            <button class="next-btn" onclick="goStep3()">다음</button>
        </div>
    </div>

    <div id="step3-screen" class="screen">
        <div class="content-area">
            <div class="title">마지막으로<br>이메일 인증이 필요해요</div>
            
            <div class="form-group">
                <span class="input-label">이메일</span>
                <div class="email-row">
                    <input type="email" id="reg-email" class="toss-input" placeholder="example@gmail.com" autocomplete="off">
                    <button class="send-code-btn" onclick="sendCode()">인증번호 보내기</button>
                </div>
            </div>

            <div class="form-group">
                <span class="input-label">인증번호</span>
                <input type="number" id="reg-code" class="toss-input" placeholder="6자리 숫자" autocomplete="off" oninput="checkVerifyCode()">
            </div>
        </div>
        <div class="bottom-area">
            <button class="next-btn" id="final-btn" onclick="finalRegister()">회원가입 완료</button>
        </div>
    </div>

    <div id="custom-modal">메시지</div>

    <script>
        // 전역 변수
        let isVerified = false;

        // 모달 표시
        function showModal(message) {
            const modal = document.getElementById('custom-modal');
            modal.innerText = message;
            modal.classList.add('show');
            setTimeout(() => { modal.classList.remove('show'); }, 2000);
        }

        // Step 1 -> 2 이동
        function goStep2() {
            const name = document.getElementById('reg-name').value;
            if(!name) { showModal("이름을 입력해주세요."); return; }
            
            document.getElementById('step1-screen').style.display = 'none';
            document.getElementById('step2-screen').style.display = 'flex';
        }

        // Step 2 -> 3 이동
        function goStep3() {
            const id = document.getElementById('reg-id').value;
            const pw = document.getElementById('reg-pw').value;
            const pwCheck = document.getElementById('reg-pw-check').value;

            if(!id) { showModal("아이디를 입력해주세요."); return; }
            if(!pw) { showModal("비밀번호를 입력해주세요."); return; }
            if(pw !== pwCheck) { 
                showModal("비밀번호가 일치하지 않습니다."); 
                document.getElementById('reg-pw-check').classList.add('error');
                return; 
            } else {
                document.getElementById('reg-pw-check').classList.remove('error');
            }

            document.getElementById('step2-screen').style.display = 'none';
            document.getElementById('step3-screen').style.display = 'flex';
        }

        // 인증코드 발송 요청
        function sendCode() {
            const email = document.getElementById('reg-email').value;
            if(!email) { showModal("이메일을 입력해주세요."); return; }

            showModal("인증코드를 보내는 중...");

            fetch('https://jaewondev.pythonanywhere.com/send-verification-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            })
            .then(res => res.json())
            .then(data => {
                showModal(data.message);
            })
            .catch(err => {
                console.error(err);
                showModal("서버 오류 발생");
            });
        }

        // 인증코드 실시간 확인 아님 -> 버튼 누를 때 확인? 
        // 아뇨, 요청사항: "인증번호를 입력해서 요청하면... 맞다면 초록색으로 변하게"
        // 사용자가 입력하고 별도 버튼 없이 확인하려면 oninput 등에서 트리거해야 하지만, 
        // 여기서는 '회원가입 완료' 전에 확인 버튼이 없으므로, 
        // 입력 필드 옆에 확인 버튼이 있거나, 입력 후 엔터 혹은 특정 길이 도달 시 체크가 필요합니다.
        // UI상 심플함을 위해 '인증번호 입력하는 텍스트박스'에 값이 6자리가 되면 자동으로 체크 요청하거나,
        // 별도의 작은 확인 버튼이 있는 것이 좋으나, 요청에 "인증번호 보내기 버튼이 있고 그아래에 인증번호를 입력하게 해줘... 인증번호가 맞으면... 초록색"이라고 했습니다.
        // 6자리가 되면 자동 체크하도록 구현하겠습니다.

        function checkVerifyCode() {
            const code = document.getElementById('reg-code').value;
            const email = document.getElementById('reg-email').value;
            const codeInput = document.getElementById('reg-code');

            if(code.length === 6) {
                fetch('https://jaewondev.pythonanywhere.com/verify-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, code: code })
                })
                .then(res => res.json())
                .then(data => {
                    if(data.success) {
                        isVerified = true;
                        codeInput.classList.remove('error');
                        codeInput.classList.add('success');
                        showModal("인증되었습니다.");
                        // 포커스 해제
                        codeInput.blur();
                    } else {
                        isVerified = false;
                        codeInput.classList.remove('success');
                        codeInput.classList.add('error');
                        showModal(data.message);
                    }
                })
                .catch(err => console.error(err));
            } else {
                codeInput.classList.remove('success', 'error');
                isVerified = false;
            }
        }

        // 최종 회원가입 요청
        function finalRegister() {
            if(!isVerified) { showModal("이메일 인증을 완료해주세요."); return; }

            const name = document.getElementById('reg-name').value;
            const id = document.getElementById('reg-id').value;
            const pw = document.getElementById('reg-pw').value;
            const email = document.getElementById('reg-email').value;

            fetch('https://jaewondev.pythonanywhere.com/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: name,
                    id: id,
                    password: pw,
                    email: email
                })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    showModal("가입 성공! 로그인 화면으로 이동합니다.");
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    showModal(data.message);
                }
            })
            .catch(err => {
                console.error(err);
                showModal("서버 오류");
            });
        }
    </script>
</body>
</html>
