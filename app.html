<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home</title>
    <style>
        /* 기본 리셋 및 폰트 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, "Noto Sans KR", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f2f4f6;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 24px;
            overflow: hidden;
        }

        /* 헤더 영역 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-top: 20px;
        }

        .welcome-text {
            font-size: 24px;
            font-weight: 700;
            color: #191f28;
            animation: fadeIn 0.6s ease-out;
        }

        .logout-btn {
            font-size: 14px;
            font-weight: 500;
            color: #8b95a1;
            background: rgba(255, 255, 255, 0.5);
            padding: 8px 16px;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:active {
            background: rgba(0, 0, 0, 0.05);
            transform: scale(0.95);
        }

        /* 2. 메인 컨텐츠 (그리드 레이아웃 수정됨) */
        .dashboard-grid {
            flex-grow: 1;
            display: grid;
            grid-template-columns: 1fr 1fr; /* 좌우 1:1 분할 */
            grid-template-rows: 1fr 1fr;    /* 상하 1:1 분할 */
            gap: 16px;
            padding-bottom: 20px;
        }

        /* 공통 카드 스타일 */
        .card {
            background-color: #ffffff;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
            overflow: hidden;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
        }

        .card:active {
            transform: scale(0.98);
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            color: #333d4b;
            z-index: 1;
        }

        .card-icon {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        /* [수정됨] 1. 계획표 (왼쪽 전체 차지) */
        .card.plan {
            grid-column: 1;      /* 1열 */
            grid-row: 1 / 3;     /* 1행부터 3행 전까지 (세로 전체) */
            background: linear-gradient(135deg, #ffffff 0%, #f9fafb 100%);
            animation-delay: 0.1s;
        }

        .card.plan .card-icon {
            width: 100px;
            height: 100px;
            opacity: 0.9;
        }

        /* [수정됨] 2. 리마인더 (오른쪽 위) */
        .card.reminder {
            grid-column: 2;
            grid-row: 1;
            animation-delay: 0.2s;
        }

        /* [수정됨] 3. 기타기능 (오른쪽 아래) */
        .card.etc {
            grid-column: 2;
            grid-row: 2;
            animation-delay: 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <div class="welcome-text" id="welcome-message">
            OOO님<br>환영합니다
        </div>
        <button class="logout-btn" onclick="logout()">로그아웃</button>
    </header>

    <div class="dashboard-grid">
        <div class="card plan" onclick="location.href='today.html'">
            <div class="card-title">계획표</div>
            <img src="icon/calendar.png" alt="Calendar" class="card-icon">
        </div>

        <div class="card reminder" onclick="location.href='reminder.html'">
            <div class="card-title">리마인더</div>
            <img src="icon/reminder.png" alt="Reminder" class="card-icon">
        </div>

        <div class="card etc" onclick="location.href='setting.html'">
            <div class="card-title">기타기능</div>
            <img src="icon/setting.webp" alt="Setting" class="card-icon">
        </div>
    </div>

    <script>
        window.onload = function() {
            const storedUser = localStorage.getItem('loginUser');
            if (!storedUser) {
                alert("로그인이 필요합니다.");
                window.location.href = 'index.html';
            } else {
                document.getElementById('welcome-message').innerHTML = `${storedUser}님<br>환영합니다`;
            }
        }

        function logout() {
            localStorage.removeItem('loginUser');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
